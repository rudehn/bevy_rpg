[package]
name = "bevy_rpg"
version = "0.1.0"
edition = "2024"

[dependencies]
# file_watcher (hot-reload) is excluded: it is a native-only feature that
# breaks WASM builds. Re-enable locally by editing this line if you need
# asset hot-reload during development: features = ["file_watcher"]
bevy = { version = "0.17.0" }
bracket-lib = { git = "https://github.com/rudehn/bracket-lib" }
petgraph = "0.8.3"
rand = "0.9.2"
bevy_common_assets = { version = "0.14.0", features = ["ron"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.10"
# roguelike_engine = { git = "https://github.com/rudehn/roguelike_engine", branch = "main" }
# Local development override for the stealth phase. Restored to the Git dep in Task L1.
# Absolute path needed because this workspace runs in a worktree under .claude/worktrees/.
roguelike_engine = { path = "/Users/nathanrude/Development/roguelike_engine" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
