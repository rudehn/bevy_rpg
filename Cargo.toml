[package]
name = "bevy_rpg"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.17.0", features = ["file_watcher"] }
bracket-lib = { git = "https://github.com/rudehn/bracket-lib" }
petgraph = "0.8.3"
rand = "0.9.2"
bevy_common_assets = { version = "0.14.0", features = ["ron"] }
serde = { version = "1.0", features = ["derive"] }
bevy_save = "0.17.0"
ron = "0.10"

# WASM: localStorage access for save/load
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
