[package]
name = "roguelike_engine"
version = "0.1.0"
edition = "2024"
description = "A reusable engine for turn-based grid roguelikes, built on Bevy 0.17."
license = "MIT OR Apache-2.0"
repository = "https://github.com/rudehn/roguelike_engine"
keywords = ["roguelike", "bevy", "gamedev", "dungeon", "procedural-generation"]
categories = ["games", "game-engines"]
readme = "README.md"

[dependencies]
bevy = { version = "0.17.0" }
bracket-lib = { git = "https://github.com/rudehn/bracket-lib" }
petgraph = "0.8.3"
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
